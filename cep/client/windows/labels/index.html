<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<title>Labels</title>
	<link rel="stylesheet" href="../../shared/base.css">
	<link rel="stylesheet" href="../../shared/window.css">
	<link rel="stylesheet" href="labels.css">
</head>
<body>
	<div class="win">
		<div class="pad" style="display: flex; flex-direction: column; gap: 12px">
			<!-- the 16 labels: click one to edit it below -->
			<div id="swatches" class="swatches" role="radiogroup" aria-label="Labels"></div>

			<!-- selected label -->
			<div id="editor" class="editor">
				<div class="ed-head">
					<span id="edIx" class="ix mono"></span>
					<input id="edName" class="fld nm" type="text" aria-label="Nome do label" spellcheck="false">
					<input id="edHex" class="fld hx mono" type="text" maxlength="7" aria-label="Cor em hex" spellcheck="false">
				</div>
				<!-- color control slot (adapted from O PADEIRO's control) -->
				<div id="picker" class="picker"></div>
			</div>
		</div>
		<div class="foot">
			<div class="sel-wrap grow">
				<select id="preset" class="fld" aria-label="Carregar preset de labels"></select>
			</div>
			<button id="apply" class="btn btn-1" disabled><span>aplicar</span></button>
		</div>
		<div class="status"><span id="note"></span></div>
	</div>
	<script src="../../shared/bridge.js"></script>
	<script src="../../shared/ui.js"></script>
	<script src="labels.js"></script>
</body>
</html>
