<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<title>Labels</title>
	<link rel="stylesheet" href="../../shared/base.css">
	<link rel="stylesheet" href="../../shared/window.css">
	<link rel="stylesheet" href="labels.css">
</head>
<body>
	<div class="win">
		<div class="pad" style="display: flex; flex-direction: column; gap: 12px">
			<!-- the 16 labels: click one to edit it below -->
			<div id="swatches" class="swatches" role="radiogroup" aria-label="Labels"></div>

			<!-- selected label:
			     [label icon + nº] [name / color tile + brightness] [hex / saved vs new] -->
			<div id="editor" class="editor">
				<div class="idcol" aria-hidden="true">
					<svg class="lic" viewBox="0 0 24 24"><path d="M7 3h10a1 1 0 0 1 1 1v12.5l-6 4.5-6-4.5V4a1 1 0 0 1 1-1z"></path><circle cx="12" cy="8" r="1.6"></circle></svg>
					<span id="edIx" class="ix mono"></span>
				</div>
				<input id="edName" class="fld nm" type="text" aria-label="Nome do label" spellcheck="false">
				<input id="edHex" class="fld hx mono" type="text" maxlength="7" aria-label="Cor em hex" spellcheck="false">
				<div class="pick">
					<div id="tile" class="pk-tile" title="arraste para escolher matiz e saturação">
						<i class="dim"></i><i class="gx"></i><i class="gy"></i><b class="mk"></b><span id="rgb" class="ftag mono"></span>
					</div>
					<div id="vs" class="pk-vs" role="slider" tabindex="0" aria-label="Brilho" aria-valuemin="0" aria-valuemax="100" title="brilho">
						<i class="trk"></i><b class="thumb"></b><span id="vtag" class="ftag vtag mono"></span>
					</div>
				</div>
				<div class="pk-cmp">
					<i id="now" class="now"></i>
					<button id="was" class="was" title="voltar para a cor gravada" aria-label="Voltar para a cor gravada"><span>gravada</span></button>
				</div>
			</div>
		</div>
		<div class="foot">
			<div class="sel-wrap grow">
				<select id="preset" class="fld" aria-label="Carregar preset de labels"></select>
			</div>
			<button id="apply" class="btn btn-1" disabled><span>aplicar</span></button>
		</div>
		<div class="status"><span id="note"></span></div>
	</div>
	<script src="../../shared/bridge.js"></script>
	<script src="../../shared/ui.js"></script>
	<script src="labels.js"></script>
</body>
</html>
